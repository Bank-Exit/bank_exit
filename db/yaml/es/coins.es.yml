- identifier: june
  name: June
  ticker: Ğ1
  description:
    - Criptomoneda inventada en Francia y basada en la Teoría Relativa del Dinero (TRD), asegura una creación monetaria justa entre sus miembros. Su ventaja es su modelo descentralizado y humano gracias a la Web of Trust (WoT), única en el mundo.
    - Aunque es muy trazable, el junio no tiene un precio expresado en euros y por tanto es muy independiente y resiliente del sistema financiero, y muy anclado en el vínculo local con los mercados G regulares.
