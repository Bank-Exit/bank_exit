- identifier: bitcoin
  name: Bitcoin
  ticker: BTC
  description:
    - La primera criptomoneda descentralizada, protegida por prueba de trabajo (PoW), Bitcoin es considerada como oro digital y sus 15 años de existencia han demostrado su capacidad como reserva global de valor. Aunque es muy rastreable, su rareza e independencia de los bancos lo hacen resistente a la inflación y al robo.
    - A medida que las finanzas tradicionales inundan este criptoactivo revolucionario, su volatilidad tiende a reducirse con el tiempo. El precio de Bitcoin ha demostrado históricamente un crecimiento impresionante de casi +90%/año en promedio, cada año durante los últimos 10 años.
  usage: Depósito de valor
  links:
    - https://bitcoin.org/es
    - https://bitcoin.org/files/bitcoin-paper/bitcoin_es.pdf
    - https://www.blockchaincenter.net/en/bitcoin-rainbow-chart/

- identifier: bitcoin-lightning-network
  name: Bitcoin Lightning Network
  short_name: Bitcoin LN
  ticker: LN
  description:
    - La Lightning Network, la red de pagos de segunda capa de Bitcoin, permite realizar transacciones casi instantáneas con comisiones extremadamente bajas, apoyándose en la seguridad de la cadena de bloques de Bitcoin. Es especialmente adecuada para pagos cotidianos y micropagos.
    - Los pagos se enrutan a través de una red descentralizada de canales de pago, sin necesidad de registrar inmediatamente cada transacción en la cadena de bloques. Este enfoque mejora considerablemente la capacidad de Bitcoin para gestionar un gran volumen de transacciones.
  usage: Pagos instantáneos
  links: []

- identifier: bitcoin-lightning-network-contactless
  name: Bitcoin Lightning Network (sin contacto)
  short_name: Bitcoin LN (sin contacto)
  ticker: LN
  description:
    - Lightning Network sin contacto permite pagar con Bitcoin simplemente acercando un teléfono inteligente o una tarjeta compatible a un terminal NFC. La experiencia de usuario es comparable a la de un pago bancario sin contacto, manteniendo las ventajas de Lightning.
    - Esta tecnología facilita la adopción de Bitcoin en los puntos de venta gracias a pagos rápidos, de bajo coste y sin intermediarios bancarios. Se basa en Lightning Network y en estándares NFC compatibles con billeteras y terminales adecuados.
  usage: Pagos instantáneos sin contacto
  links: []

- identifier: gold
  name: Oro
  ticker: XAU
  description:
    - El oro, un refugio seguro ancestral, históricamente ha protegido contra la inflación y las crisis. A diferencia de otras reservas de valor, es física y reconocida mundialmente sin depender de un sistema informático, pero es difícilmente viable en la práctica para intercambios regulares entre ciudadanos salvo en caso de una ruptura significativa de la normalidad.
  usage: Depósito de valor
  links:
    - https://www.bitgild.com/es
    - https://celticgold.eu

- identifier: silver
  name: Plata
  ticker: XAG
  description:
    - Medio de cambio en situaciones de crisis, más fácil de considerar para intercambios y compras regulares en caso de crisis debido a su menor densidad de valor que el oro. Combina el uso industrial y la imposibilidad de rastrear, algo que el euro digital no puede ofrecer.
  usage: Método de pago crítico
  links:
    - https://www.bitgild.com/es
    - https://celticgold.eu
