- identifier: monero
  name: Monero
  ticker: XMR
  description:
    - Moyen d'échange axé sur la confidentialité totale, il garantit des transactions intraçables comme des espèces numériques. Sécurisé en proof of Work (PoW) par ordinateur classique, le fisc US a offert 620 000$ à quiconque réussirait à casser son chiffrement, sans succès.
    - Sa force réside dans son anonymat complet, contrairement à l’euro numérique, qui sera ultra surveillé. Bien que les systèmes bancaires et étatiques le dénigrent car ils le craignent, les attaques contre Monero l'ont beaucoup renforcé.
    - Son cours a été relativement stable de 2022 à 2025 comparé à la hausse de Bitcoin.
  usage: Moyen de paiement
  links:
    - https://getmonero.org
    - https://monero.eco
    - https://www.abcbourse.com/graphes/eod/XMRUSDu/lc9

- identifier: june
  name: June
  ticker: Ğ1
  description:
    - Cryptomonnaie inventée en France et basée sur la Théorie Relative de la Monnaie (TRM), elle assure une création monétaire équitable entre ses membres. Son avantage est son modèle décentralisé et humain grâce à la Toile de Confiance (WoT) unique au monde.
    - Même si elle est hautement traçable, la June n'a pas de cours exprimé en euro et est donc très indépendante et résiliente du système financier, et très ancrée dans le lien local avec G-marchés réguliers.
  usage: Identité citoyenne
  links:
    - https://monnaie-libre.fr
    - https://forum.monnaie-libre.fr/c/rencontres/21
    - https://carte.monnaie-libre.fr/?lat=46.240651955001695&lng=2.1972656250000004&zoom=5

- identifier: bitcoin
  name: Bitcoin
  ticker: BTC
  description:
    - Première crypto décentralisée, sécurisée par la preuve de travail (PoW), Bitcoin est vu comme l’or numérique et ses 15 années d'existence ont prouvé sa capacité de réserve de valeur mondiale. Bien que hautement traçable, sa rareté et son indépendance des banques le rendent résistant à l’inflation et à la spoliation.
    - A mesure que la finance traditionnelle se déverse dans ce cryptoactif révolutionnaire, sa volatilité a tendance à réduire avec le temps. Le cours de Bitcoin a historiquement prouvé une croissance impressionnante de près de +90%/an par an en moyenne, chaque année depuis 10 ans.
  usage: Réserve de valeur
  links:
    - https://bitcoin.fr
    - https://bitcoin.org/files/bitcoin-paper/bitcoin_fr.pdf
    - https://www.blockchaincenter.net/en/bitcoin-rainbow-chart/

- identifier: bitcoin-lightning-network
  name: Bitcoin Lightning Network
  short_name: Bitcoin LN
  ticker: LN
  description:
    - Réseau de paiement de seconde couche de Bitcoin, le Lightning Network permet d’effectuer des transactions quasi instantanées avec des frais extrêmement faibles, tout en s’appuyant sur la sécurité de la blockchain Bitcoin. Il est particulièrement adapté aux paiements du quotidien et aux micropaiements.
    - Les paiements sont acheminés à travers un réseau décentralisé de canaux de paiement, sans nécessiter l’enregistrement immédiat de chaque transaction sur la blockchain. Cette approche améliore considérablement la capacité de Bitcoin à gérer un grand volume de transactions.
  usage: Paiements instantanés
  links:
    - https://planb.academy/fr/courses/theorie-du-lightning-network-34bd43ef-6683-4a5c-b239-7cb1e40a4aeb

- identifier: bitcoin-lightning-network-contactless
  name: Bitcoin Lightning Network (sans contact)
  short_name: Bitcoin LN (sans contact)
  ticker: LN
  description:
    - Le Lightning Network sans contact permet de régler un paiement Bitcoin simplement en approchant un smartphone ou une carte compatible d’un terminal NFC. L’expérience utilisateur devient comparable à celle d’un paiement bancaire sans contact, tout en conservant les avantages de Lightning.
    - Cette technologie facilite l’adoption de Bitcoin en point de vente grâce à des paiements rapides, à faibles frais et sans intermédiaire bancaire. Elle s’appuie sur le Lightning Network et sur des standards NFC compatibles avec les portefeuilles et terminaux adaptés.
  usage: Paiements instantanés sans contact
  links:
    - https://planb.academy/fr/courses/theorie-du-lightning-network-34bd43ef-6683-4a5c-b239-7cb1e40a4aeb

- identifier: gold
  name: Or
  ticker: XAU
  description:
