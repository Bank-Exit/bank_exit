  usage: Réserve de valeur
  links:
    - https://www.bitgild.com/fr
    - https://celticgold.eu

- identifier: silver
  name: Argent
  ticker: XAG
  description:
    - Moyen d'échange de crise, plus facile à envisager pour les échanges et achats réguliers en cas de crise par sa plus faible densité de valeur que l'or. Il allie usage industriel et intraçabilité, ce que l’euro numérique ne peut offrir.
  usage: Moyen de paiement critique
  links:
