- identifier: june
  name: June
  ticker: Ğ1
  description:
    - Una criptovaluta inventata in Francia basata sulla Teoria Relativa della Moneta (TRM), che garantisce una creazione monetaria equa tra i suoi membri. Il suo vantaggio è il modello decentralizzato e centrato sull’umano grazie al Web of Trust (WoT), una rete unica al mondo.
    - Sebbene altamente tracciabile, June non ha un cambio in euro ed è quindi molto indipendente e resiliente rispetto al sistema finanziario, radicato profondamente nella connessione locale ai mercati G regolari.
  usage: Identità cittadina
  links:
