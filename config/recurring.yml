fetch_merchants: &fetch_merchants
  periodic_fetch_merchants:
    command: "FetchMerchants.call"
    schedule: "10 2,8,14,20 * * *" # Every 6 hours starting at 2:10am

clear_merchants: &clear_merchants
  periodic_clear_merchants:
    command: "Merchants::ClearOutdated.call"
    schedule: every day at 6am

refresh_sitemap: &refresh_sitemap
  periodic_refresh_sitemap:
    class: RakeTaskJob
    args: "sitemap:refresh:no_ping"
    schedule: every day at 7pm

rails_pulse: &rails_pulse
  rails_pulse_summary:
    class: RailsPulse::SummaryJob
    schedule: every hour at minute 5
  rails_pulse_cleanup:
    class: RailsPulse::CleanupJob
    schedule: every monday at 9am

staging:
  <<:
    - *fetch_merchants
    - *clear_merchants
    - *refresh_sitemap
    - *rails_pulse

production:
  <<:
    - *fetch_merchants
    - *clear_merchants
    - *refresh_sitemap
    - *rails_pulse
