      pgp_tooltip_html: |
        <strong>Pretty Good Privacy</strong> (PGP) es un algoritmo criptográfico híbrido que se puede utilizar, entre otras cosas, para cifrar y firmar datos. <br /> Configure esta clave en su cliente de correo electrónico para contactar al Colectivo de forma privada.

